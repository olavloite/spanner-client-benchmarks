name: Nightly Spanner Client Benchmarks

on:
  schedule:
    - cron: '49 5 * * *'
  workflow_dispatch:

env:
  PROJECT_ID: appdev-soda-spanner-staging
  INSTANCE_ID: knut-test-ycsb
  DATABASE_ID: spring-data-jpa
  REGION: europe-north1
  DURATION: 15h
  CPU: 2
  MEMORY: 8Gi
  SKIP_CLEANUP: 'true'

jobs:
  cleanup:
    name: Maintenance Cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Run automated cleanup
        run: ./cleanup_benchmarks.sh

  deploy-benchmarks:
    name: Deploy Benchmark
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [java, go, node, python, rust]
        benchmark_type: [point-select, select-update, read-large-result-set]
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy and Execute Benchmark Preset
        env:
          BENCHMARK_TYPE: ${{ matrix.benchmark_type }}
          DURATION: ${{ matrix.benchmark_type == 'read-large-result-set' && '1h' || '15h' }}
          FOR_ALERTING: 'true'
          BENCHMARK_NAME: 'scheduled-main'
        run: ./run_benchmark.sh ${{ matrix.client }}
