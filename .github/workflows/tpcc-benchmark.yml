name: TPC-C Benchmark Runner

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'What benchmark suite action to run'
        required: true
        type: choice
        options:
          - tpcc-init (schema and data populator)
          - tpcc (all languages)
          - tpcc (java)
          - tpcc (go)
          - tpcc (node)
          - tpcc (python)
          - tpcc (rust)
        default: 'tpcc-init (schema and data populator)'
      warehouses:
        description: 'Scale factor (number of warehouses)'
        required: true
        type: string
        default: '1000'
      items:
        description: 'Number of catalog items'
        required: true
        type: string
        default: '1000000'
      duration:
        description: 'Execution duration (if running benchmark)'
        required: false
        type: string
        default: '60m'
      benchmark_name:
        description: 'Custom benchmark name identifier in metrics'
        required: false
        type: string
        default: 'manual-tpcc'

env:
  PROJECT_ID: appdev-soda-spanner-staging
  INSTANCE_ID: knut-test-ycsb
  DATABASE_ID: benchmarks
  REGION: europe-north1
  CPU: 2
  MEMORY: 4Gi
  SKIP_CLEANUP: 'true'

jobs:
  run-tpcc-benchmark:
    name: Run TPC-C Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Determine Client Matrix and Execute
        env:
          ACTION: ${{ inputs.action }}
          DURATION: ${{ inputs.duration }}
          WAREHOUSES: ${{ inputs.warehouses }}
          ITEMS: ${{ inputs.items }}
          FOR_ALERTING: 'false'
          BENCHMARK_NAME: ${{ inputs.benchmark_name }}
        run: |
          if [ "$ACTION" = "tpcc-init (schema and data populator)" ]; then
            export BENCHMARK_TYPE="tpcc-init"
            ./run_benchmark.sh java
          elif [ "$ACTION" = "tpcc (all languages)" ]; then
            export BENCHMARK_TYPE="tpcc"
            ./run_benchmark.sh java
            ./run_benchmark.sh go
            ./run_benchmark.sh node
            ./run_benchmark.sh python
            ./run_benchmark.sh rust
          else
            export BENCHMARK_TYPE="tpcc"
            CLIENT=$(echo "$ACTION" | sed -n 's/tpcc (\(.*\))/\1/p')
            ./run_benchmark.sh $CLIENT
          fi
