name: Benchmark Template

on:
  workflow_call:
    inputs:
      benchmark_types:
        description: 'JSON array of benchmark types'
        required: true
        type: string
      duration:
        description: 'Benchmark execution duration'
        required: true
        type: string
      tps:
        description: 'Benchmark target TPS (optional)'
        required: false
        type: string
      burst_factor:
        description: 'Burst factor (optional)'
        required: false
        type: string
      burst_duration:
        description: 'Burst duration in seconds (optional)'
        required: false
        type: string
      burst_fraction:
        description: 'Burst fraction (optional)'
        required: false
        type: string
      benchmark_name:
        description: 'Custom benchmark name identifier'
        required: false
        type: string
        default: 'scheduled-main'
    secrets:
      GCP_SA_KEY:
        required: true

env:
  PROJECT_ID: appdev-soda-spanner-staging
  INSTANCE_ID: knut-test-ycsb
  DATABASE_ID: spring-data-jpa
  REGION: europe-north1
  CPU: 2
  MEMORY: 4Gi
  SKIP_CLEANUP: 'true'

jobs:
  cleanup:
    name: Maintenance Cleanup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Run automated cleanup
        run: ./cleanup_benchmarks.sh

  deploy-benchmarks:
    name: Deploy Benchmark
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [java, go, node, python, rust]
        benchmark_type: ${{ fromJSON(inputs.benchmark_types) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy and Execute Benchmark Preset
        env:
          BENCHMARK_TYPE: ${{ matrix.benchmark_type }}
          DURATION: ${{ inputs.duration }}
          TPS: ${{ inputs.tps }}
          BURST_FACTOR: ${{ inputs.burst_factor }}
          BURST_DURATION: ${{ inputs.burst_duration }}
          BURST_FRACTION: ${{ inputs.burst_fraction }}
          FOR_ALERTING: 'true'
          BENCHMARK_NAME: ${{ inputs.benchmark_name }}
        run: ./run_benchmark.sh ${{ matrix.client }}
