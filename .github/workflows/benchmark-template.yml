name: Benchmark Template

on:
  workflow_call:
    inputs:
      benchmark_types:
        description: 'JSON array of benchmark types'
        required: true
        type: string
      duration:
        description: 'Benchmark execution duration'
        required: true
        type: string
      load_type:
        description: 'Load type (steady, spiky, gradual)'
        required: false
        type: string
      tps:
        description: 'Benchmark target TPS (optional)'
        required: false
        type: string
      threads:
        description: 'Number of concurrent threads (optional)'
        required: false
        type: string
      burst_factor:
        description: 'Burst factor (optional)'
        required: false
        type: string
      burst_duration:
        description: 'Burst duration in seconds (optional)'
        required: false
        type: string
      burst_fraction:
        description: 'Burst fraction (optional)'
        required: false
        type: string
      benchmark_name:
        description: 'Custom benchmark name identifier'
        required: false
        type: string
        default: 'scheduled-main'
      database_id:
        description: 'Database ID to run the benchmark against'
        required: false
        type: string
        default: 'spring-data-jpa'
      clients:
        description: 'JSON array of client languages to run'
        required: false
        type: string
        default: '["java", "go", "node", "python", "rust"]'
      cpu:
        description: 'Number of vCPUs'
        required: false
        type: string
        default: '4'
      memory:
        description: 'Memory allocation'
        required: false
        type: string
        default: '4Gi'
      warehouses:
        description: 'Scale factor (number of warehouses) - TPC-C only (optional)'
        required: false
        type: string
        default: ''
      items:
        description: 'Number of catalog items - TPC-C only (optional)'
        required: false
        type: string
        default: ''
      for_alerting:
        description: 'Mark metrics for alerting'
        required: false
        type: string
        default: 'false'
      mock:
        description: 'Run benchmark in mock mode (true/false)'
        required: false
        type: string
        default: 'false'
      use_sidecar:
        description: 'Use sidecar for load generation (true/false)'
        required: false
        type: string
        default: 'false'
      spanner_num_channels:
        description: 'Number of gRPC channels (optional)'
        required: false
        type: string
        default: ''
    secrets:
      GCP_SA_KEY:
        required: true

env:
  PROJECT_ID: appdev-soda-spanner-staging
  INSTANCE_ID: knut-test-ycsb
  DATABASE_ID: ${{ inputs.database_id }}
  REGION: europe-north1
  CPU: ${{ inputs.cpu }}
  MEMORY: ${{ inputs.memory }}
  SKIP_CLEANUP: 'true'
  BENCHMARK_TARGET: gce

jobs:
  deploy-benchmarks:
    name: Deploy Benchmark
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: ${{ fromJSON(inputs.clients) }}
        benchmark_type: ${{ fromJSON(inputs.benchmark_types) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy and Execute Benchmark Preset
        env:
          BENCHMARK_TYPE: ${{ matrix.benchmark_type }}
          DURATION: ${{ inputs.duration }}
          LOAD_TYPE: ${{ inputs.load_type }}
          TPS: ${{ inputs.tps }}
          THREADS: ${{ inputs.threads }}
          BURST_FACTOR: ${{ inputs.burst_factor }}
          BURST_DURATION: ${{ inputs.burst_duration }}
          BURST_FRACTION: ${{ inputs.burst_fraction }}
          FOR_ALERTING: ${{ inputs.for_alerting }}
          BENCHMARK_NAME: ${{ inputs.benchmark_name }}
          WAREHOUSES: ${{ inputs.warehouses }}
          ITEMS: ${{ inputs.items }}
          MOCK: ${{ inputs.mock }}
          USE_SIDECAR: ${{ inputs.use_sidecar }}
          SPANNER_NUM_CHANNELS: ${{ inputs.spanner_num_channels }}
        run: ./run_benchmark.sh ${{ matrix.client }}
