name: Latency Benchmarks

on:
  schedule:
    - cron: "42 5 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Benchmark workload to run"
        required: false
        type: choice
        options:
          - all
          - steady-point-select
          - steady-select-update
          - sine-point-select
          - sine-select-update
        default: "all"
      clients:
        description: "JSON array of client languages to run"
        required: false
        type: string
        default: '["java", "go", "node", "python", "rust"]'
      client_branch:
        description: "Client branch to benchmark (optional)"
        required: false
        type: string
        default: "main"
      spanner_enable_channel_pool:
        description: "Enable dynamic channel pool (true/false)"
        required: false
        type: string
        default: "false"
      benchmark_name:
        description: "Custom benchmark name identifier (optional)"
        required: false
        type: string
        default: ""
      duration:
        description: "Benchmark execution duration"
        required: false
        type: string
        default: "2h"
      for_alerting:
        description: "Mark metrics for alerting"
        required: false
        type: boolean
        default: false

jobs:
  run-steady-point-select:
    if: ${{ github.event_name == 'schedule' || inputs.action == 'all' || inputs.action == 'steady-point-select' || inputs.action == '' }}
    uses: ./.github/workflows/benchmark-template.yml
    with:
      benchmark_types: '["point-select"]'
      duration: "${{ inputs.duration || '2h' }}"
      load_type: "steady"
      tps: "100"
      use_sidecar: "true"
      clients: "${{ inputs.clients || '[\"java\", \"go\", \"node\", \"python\", \"rust\"]' }}"
      client_branch: "${{ inputs.client_branch || 'main' }}"
      spanner_enable_channel_pool: "${{ inputs.spanner_enable_channel_pool || 'false' }}"
      benchmark_name: "${{ inputs.benchmark_name || 'scheduled-steady-point-select' }}"
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  run-steady-select-update:
    if: ${{ github.event_name == 'schedule' || inputs.action == 'all' || inputs.action == 'steady-select-update' }}
    uses: ./.github/workflows/benchmark-template.yml
    with:
      benchmark_types: '["select-update"]'
      duration: "${{ inputs.duration || '2h' }}"
      load_type: "steady"
      tps: "50"
      use_sidecar: "true"
      clients: "${{ inputs.clients || '[\"java\", \"go\", \"node\", \"python\", \"rust\"]' }}"
      client_branch: "${{ inputs.client_branch || 'main' }}"
      spanner_enable_channel_pool: "${{ inputs.spanner_enable_channel_pool || 'false' }}"
      benchmark_name: "${{ inputs.benchmark_name || 'scheduled-steady-select-update' }}"
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  run-sine-point-select:
    if: ${{ github.event_name == 'schedule' || inputs.action == 'all' || inputs.action == 'sine-point-select' }}
    uses: ./.github/workflows/benchmark-template.yml
    with:
      benchmark_types: '["point-select"]'
      duration: "${{ inputs.duration || '2h' }}"
      load_type: "gradual"
      tps: "100"
      cycle_duration: "1h"
      peak_factor: "2.0"
      use_sidecar: "true"
      clients: "${{ inputs.clients || '[\"java\", \"go\", \"node\", \"python\", \"rust\"]' }}"
      client_branch: "${{ inputs.client_branch || 'main' }}"
      spanner_enable_channel_pool: "${{ inputs.spanner_enable_channel_pool || 'false' }}"
      benchmark_name: "${{ inputs.benchmark_name || 'scheduled-sine-point-select' }}"
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  run-sine-select-update:
    if: ${{ github.event_name == 'schedule' || inputs.action == 'all' || inputs.action == 'sine-select-update' }}
    uses: ./.github/workflows/benchmark-template.yml
    with:
      benchmark_types: '["select-update"]'
      duration: "${{ inputs.duration || '2h' }}"
      load_type: "gradual"
      tps: "50"
      cycle_duration: "1h"
      peak_factor: "2.0"
      use_sidecar: "true"
      clients: "${{ inputs.clients || '[\"java\", \"go\", \"node\", \"python\", \"rust\"]' }}"
      client_branch: "${{ inputs.client_branch || 'main' }}"
      spanner_enable_channel_pool: "${{ inputs.spanner_enable_channel_pool || 'false' }}"
      benchmark_name: "${{ inputs.benchmark_name || 'scheduled-sine-select-update' }}"
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
