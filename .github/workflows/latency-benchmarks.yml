name: Steady Latency Benchmarks

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Benchmark workload to run"
        required: false
        type: choice
        options:
          - all
          - steady-point-select
          - steady-select-update
        default: "all"
      clients:
        description: "JSON array of client languages to run"
        required: false
        type: string
        default: '["go", "go-sql", "java", "jdbc", "node", "python", "python-async", "rust"]'
      client_branch:
        description: "Client branch to benchmark (optional)"
        required: false
        type: string
        default: "main"
      spanner_enable_channel_pool:
        description: "Enable dynamic channel pool (true/false)"
        required: false
        type: string
        default: "false"
      spanner_enable_dynamic_channel_pool:
        description: "Enable dynamic channel pool for Rust (true/false)"
        required: false
        type: string
        default: "false"
      google_spanner_enable_direct_access:
        description: "Enable DirectPath for Java/Go (true/false)"
        required: false
        type: string
        default: "false"
      benchmark_name:
        description: "Custom benchmark name identifier (optional)"
        required: false
        type: string
        default: ""
      duration:
        description: "Benchmark execution duration"
        required: false
        type: string
        default: "1h"
      for_alerting:
        description: "Mark metrics for alerting"
        required: false
        type: boolean
        default: false

jobs:
  run-steady-point-select:
    if: ${{ github.event_name == 'schedule' || inputs.action == 'all' || inputs.action == 'steady-point-select' || inputs.action == '' }}
    uses: ./.github/workflows/benchmark-template.yml
    with:
      benchmark_types: '["point-select"]'
      duration: "${{ inputs.duration || '1h' }}"
      load_type: "steady"
      tps: "100"
      use_sidecar: "true"
      clients: "${{ inputs.clients || '[\"go\", \"java\", \"jdbc\", \"node\", \"python\", \"python-async\", \"rust\"]' }}"
      client_branch: "${{ inputs.client_branch || 'main' }}"
      spanner_enable_channel_pool: "${{ inputs.spanner_enable_channel_pool || 'false' }}"
      spanner_enable_dynamic_channel_pool: "${{ inputs.spanner_enable_dynamic_channel_pool || 'false' }}"
      google_spanner_enable_direct_access: "${{ inputs.google_spanner_enable_direct_access || 'false' }}"
      benchmark_name: "${{ inputs.benchmark_name || 'scheduled-steady-point-select' }}"
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  run-steady-select-update:
    if: ${{ github.event_name == 'schedule' || inputs.action == 'all' || inputs.action == 'steady-select-update' }}
    uses: ./.github/workflows/benchmark-template.yml
    with:
      benchmark_types: '["select-update"]'
      duration: "${{ inputs.duration || '1h' }}"
      load_type: "steady"
      tps: "50"
      use_sidecar: "true"
      clients: "${{ inputs.clients || '[\"go\", \"java\", \"jdbc\", \"node\", \"python\", \"python-async\", \"rust\"]' }}"
      client_branch: "${{ inputs.client_branch || 'main' }}"
      spanner_enable_channel_pool: "${{ inputs.spanner_enable_channel_pool || 'false' }}"
      spanner_enable_dynamic_channel_pool: "${{ inputs.spanner_enable_dynamic_channel_pool || 'false' }}"
      google_spanner_enable_direct_access: "${{ inputs.google_spanner_enable_direct_access || 'false' }}"
      benchmark_name: "${{ inputs.benchmark_name || 'scheduled-steady-select-update' }}"
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
