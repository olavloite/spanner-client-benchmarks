name: units

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  java-tests:
    name: Java Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify code formatting
        working-directory: java
        run: mvn fmt:check

      - name: Run tests
        working-directory: java
        run: mvn -B -ntp test

  java-snapshot-tests:
    name: Java Snapshot Compatibility Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run build script (clones and tests against Java client main branch)
        working-directory: java
        run: ./build_app.sh

  go-tests:
    name: Go Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25'
          cache-dependency-path: go/go.sum

      - name: Download Go modules
        working-directory: go
        run: go mod download

      - name: Check formatting
        working-directory: go
        run: |
          if [ -n "$(gofmt -s -l .)" ]; then
            echo "Go files are not formatted. Run 'gofmt -s -w .'"
            gofmt -s -d .
            exit 1
          fi

      - name: Run tests
        working-directory: go
        run: go test -v ./...

  python-tests:
    name: Python Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: python/requirements.txt

      - name: Install dependencies
        working-directory: python
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify formatting and style
        working-directory: python
        run: |
          pip install ruff
          ruff format --check .
          ruff check .

      - name: Run tests
        working-directory: python
        run: python3 -m unittest discover -s tests

  node-tests:
    name: Node.js Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: node
        run: npm install

      - name: Run linter/formatter check
        working-directory: node
        run: npm run lint

      - name: Build typescript
        working-directory: node
        run: npm run build

      - name: Run tests
        working-directory: node
        run: node --test dist/src/test/**/*.test.js

  rust-tests:
    name: Rust Integration Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --check

      - name: Check TOML formatting
        uses: tamasfe/taplo-actions@v0.8
        with:
          run: fmt --check

      - name: Run tests
        working-directory: rust
        run: cargo test --quiet

  analyzer-checks:
    name: Analyzer Style Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Verify formatting
        working-directory: analyzer
        run: mvn fmt:check
