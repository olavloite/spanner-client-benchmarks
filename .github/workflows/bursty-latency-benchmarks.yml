name: Bursty Latency Benchmarks

on:
  schedule:
    # Schedule at 05:42 UTC
    - cron: '42 5 * * *'
  workflow_dispatch:
    inputs:
      for_alerting:
        description: 'Mark metrics for alerting'
        required: false
        type: boolean
        default: false

jobs:
  run-point-select:
    uses: ./.github/workflows/benchmark-template.yml
    with:
      benchmark_types: '["point-select"]'
      duration: '2h'
      load_type: 'spiky'
      tps: '50'
      burst_factor: '4.0'
      burst_duration: '5.0'
      burst_fraction: '0.1'
      benchmark_name: 'scheduled-bursty-point-select'
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  run-select-update:
    uses: ./.github/workflows/benchmark-template.yml
    with:
      benchmark_types: '["select-update"]'
      duration: '2h'
      load_type: 'spiky'
      tps: '25'
      burst_factor: '4.0'
      burst_duration: '5.0'
      burst_fraction: '0.1'
      benchmark_name: 'scheduled-bursty-select-update'
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
