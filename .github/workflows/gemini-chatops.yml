name: Gemini ChatOps Benchmark Bot

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

permissions:
  issues: write
  actions: write
  id-token: write
  contents: read

jobs:
  check-and-run:
    name: Parse and Deploy Benchmarks
    if: |
      github.event.issue.pull_request == null &&
      (
        (github.event_name == 'issue_comment' && contains(fromJson('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.comment.author_association) && contains(github.event.comment.body, '@gemini-bench')) ||
        (github.event_name == 'issues' && contains(fromJson('["COLLABORATOR", "MEMBER", "OWNER"]'), github.event.issue.author_association) && contains(github.event.issue.body, '@gemini-bench'))
      )
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Check if benchmark is already running
        id: check_running
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          labels=$(gh issue view "${{ github.event.issue.number }}" --json labels --jq '.labels[].name')
          if echo "$labels" | grep -q "benchmark-running"; then
            echo "A benchmark is already running for this issue. Skipping this run."
            gh issue comment "${{ github.event.issue.number }}" --body "⚠️ **Gemini Bot**: A benchmark is already running for this issue. Please wait for it to complete before requesting another."
            echo "already_running=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_running=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add running label to issue
        if: steps.check_running.outputs.already_running == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" --add-label "benchmark-running"

      - name: Checkout code
        if: steps.check_running.outputs.already_running == 'false'
        uses: actions/checkout@v6

      - name: Authenticate to Google Cloud
        if: steps.check_running.outputs.already_running == 'false'
        id: auth
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          token_format: 'access_token'

      - name: Set up Python
        if: steps.check_running.outputs.already_running == 'false'
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Issue Comments History
        if: steps.check_running.outputs.already_running == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue view "${{ github.event.issue.number }}" --json body,comments > thread.json

      - name: Parse Chat History with Gemini
        if: steps.check_running.outputs.already_running == 'false'
        id: parse
        env:
          GCP_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
          PROJECT_ID: 'appdev-soda-spanner-staging'
        run: |
          python3 .github/scripts/parse_chatops.py thread.json > runs.json
          echo "Parsed benchmark plan:"
          cat runs.json

      - name: Evaluate Parser Output
        if: steps.check_running.outputs.already_running == 'false'
        id: eval
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if jq -e '.clarification_needed == true' runs.json > /dev/null; then
            question=$(jq -r '.question' runs.json)
            gh issue comment "${{ github.event.issue.number }}" --body "🤖 **Gemini Bot**: $question"
            gh issue edit "${{ github.event.issue.number }}" --remove-label "benchmark-running"
            echo "clarification_needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "clarification_needed=false" >> "$GITHUB_OUTPUT"
            comment_url=$(gh issue comment "${{ github.event.issue.number }}" --body "🤖 **Gemini Bot**: Benchmark has been queued and is starting. [Monitor Action Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})")
            comment_id=$(echo "$comment_url" | grep -oE "[0-9]+$")
            echo "comment_id=$comment_id" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Cloud SDK
        if: steps.check_running.outputs.already_running == 'false' && steps.eval.outputs.clarification_needed == 'false'
        uses: google-github-actions/setup-gcloud@v3

      - name: Deploy and Execute Benchmarks in Parallel
        if: steps.check_running.outputs.already_running == 'false' && steps.eval.outputs.clarification_needed == 'false'
        run: |
          pids=()
          names=()

          # Loop through each run configuration in runs.json and execute in background
          while read -r run; do
            client_type=$(echo "$run" | jq -r '.client_type')
            client_branch=$(echo "$run" | jq -r '.client_branch')
            benchmark_type=$(echo "$run" | jq -r '.benchmark_type')
            duration=$(echo "$run" | jq -r '.duration')
            cpu=$(echo "$run" | jq -r '.cpu')
            memory=$(echo "$run" | jq -r '.memory')
            benchmark_name=$(echo "$run" | jq -r '.benchmark_name')
            load_type=$(echo "$run" | jq -r '.load_type')
            tps=$(echo "$run" | jq -r '.tps')
            threads=$(echo "$run" | jq -r '.threads')
            num_rows=$(echo "$run" | jq -r '.num_rows')
            burst_factor=$(echo "$run" | jq -r '.burst_factor')
            burst_duration=$(echo "$run" | jq -r '.burst_duration')
            burst_fraction=$(echo "$run" | jq -r '.burst_fraction')
            warehouses=$(echo "$run" | jq -r '.warehouses')
            items=$(echo "$run" | jq -r '.items')
            clients=$(echo "$run" | jq -r '.clients')

            label="$client_type-$client_branch"
            echo "Starting deployment for $client_type benchmark (branch: $client_branch)..."
            
            CLIENT_BRANCH="$client_branch" \
            BENCHMARK_TYPE="$benchmark_type" \
            DURATION="$duration" \
            CPU="$cpu" \
            MEMORY="$memory" \
            BENCHMARK_NAME="$benchmark_name" \
            LOAD_TYPE="$load_type" \
            TPS="$tps" \
            THREADS="$threads" \
            NUM_ROWS="$num_rows" \
            BURST_FACTOR="$burst_factor" \
            BURST_DURATION="$burst_duration" \
            BURST_FRACTION="$burst_fraction" \
            WAREHOUSES="$warehouses" \
            ITEMS="$items" \
            CLIENTS="$clients" \
            FOR_ALERTING="false" \
            SKIP_CLEANUP="true" \
            ./run_benchmark.sh "$client_type" 2>&1 | sed "s/^/[$label] /" &
            
            pids+=($!)
            names+=("$label")
          done < <(jq -c '.runs[]' runs.json)

          # Wait for all background tasks and collect exit status
          failed=0
          for i in "${!pids[@]}"; do
            pid="${pids[i]}"
            name="${names[i]}"
            if ! wait "$pid"; then
              echo "Error: Benchmark deployment '$name' (PID: $pid) failed!"
              failed=1
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Error: One or more benchmark deployments failed."
            exit 1
          fi
          echo "All deployments completed successfully."

      - name: Remove running label on completion/failure
        if: always() && steps.check_running.outputs.already_running == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue edit "${{ github.event.issue.number }}" --remove-label "benchmark-running" || true
          
          comment_id="${{ steps.eval.outputs.comment_id }}"
          if [ -n "$comment_id" ]; then
            if [ "${{ job.status }}" = "success" ]; then
              gh api -X PATCH repos/${{ github.repository }}/issues/comments/$comment_id -f body="🤖 **Gemini Bot**: Benchmark run completed successfully! [View Action Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            else
              gh api -X PATCH repos/${{ github.repository }}/issues/comments/$comment_id -f body="❌ **Gemini Bot**: Benchmark run failed. [View Error Logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            fi
          fi
