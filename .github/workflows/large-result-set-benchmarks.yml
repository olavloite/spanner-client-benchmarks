name: Large Result Set Benchmarks

on:
  schedule:
    - cron: "47 17 * * *"
  workflow_dispatch:
    inputs:
      clients:
        description: "JSON array of client languages to run"
        required: false
        type: string
        default: '["java", "go", "node", "python", "rust"]'
      client_branch:
        description: "Client branch to benchmark (optional)"
        required: false
        type: string
        default: "main"
      benchmark_name:
        description: "Custom benchmark name identifier (optional)"
        required: false
        type: string
        default: "scheduled-main"
      duration:
        description: "Benchmark execution duration"
        required: false
        type: string
        default: "1h"
      for_alerting:
        description: "Mark metrics for alerting"
        required: false
        type: boolean
        default: false
      lazy_decode:
        description: "Enable lazy decoding for result sets (true/false)"
        required: false
        type: boolean
        default: false

jobs:
  run:
    uses: ./.github/workflows/benchmark-template.yml
    with:
      benchmark_types: '["read-large-result-set", "read-narrow-result-set"]'
      duration: "${{ inputs.duration || '1h' }}"
      load_type: "closed-loop"
      threads: "1"
      cpu: "2"
      clients: "${{ inputs.clients || '[\"java\", \"go\", \"node\", \"python\", \"rust\"]' }}"
      client_branch: "${{ inputs.client_branch || 'main' }}"
      benchmark_name: "${{ inputs.benchmark_name || 'scheduled-main' }}"
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
      lazy_decode: "${{ inputs.lazy_decode == true || inputs.lazy_decode == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
