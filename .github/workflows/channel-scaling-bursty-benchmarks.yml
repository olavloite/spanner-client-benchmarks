name: Channel Scaling Bursty Benchmarks

on:
  schedule:
    # Run daily at 08:30 UTC
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: 'Benchmark workload to run'
        required: false
        type: choice
        options:
          - all
          - point-select-multi-core
          - point-select-single-core
          - select-update-multi-core
          - select-update-single-core
        default: 'all'
      clients:
        description: 'JSON array of client languages to run'
        required: false
        type: string
        default: ''
      client_branch:
        description: 'Client branch to benchmark (optional)'
        required: false
        type: string
        default: 'main'
      spanner_enable_channel_pool:
        description: 'Enable dynamic channel pool (true/false)'
        required: false
        type: string
        default: 'false'
      benchmark_name:
        description: 'Custom benchmark name identifier (optional)'
        required: false
        type: string
        default: ''
      duration:
        description: 'Benchmark execution duration'
        required: false
        type: string
        default: '1h'
      tps:
        description: 'Custom target TPS (optional, overrides preset default if set)'
        required: false
        type: string
        default: ''
      for_alerting:
        description: 'Mark metrics for alerting'
        required: false
        type: boolean
        default: false

jobs:
  run-point-select-multi-core:
    if: ${{ github.event_name == 'schedule' || inputs.action == 'all' || inputs.action == 'point-select-multi-core' || inputs.action == '' }}
    uses: ./.github/workflows/benchmark-template.yml
    with:
      clients: "${{ inputs.clients != '' && inputs.clients || '[\"java\", \"go\", \"rust\", \"node\"]' }}"
      benchmark_types: '["point-select"]'
      duration: "${{ inputs.duration || '1h' }}"
      load_type: 'spiky'
      tps: "${{ inputs.tps != '' && inputs.tps || '2000' }}"
      threads: '500'
      burst_factor: '3.8'
      burst_duration: '5.0'
      burst_fraction: '0.25'
      cpu: '4'
      memory: '4Gi'
      use_sidecar: 'true'
      spanner_num_channels: '16'
      client_branch: "${{ inputs.client_branch || 'main' }}"
      spanner_enable_channel_pool: "${{ inputs.spanner_enable_channel_pool || 'false' }}"
      benchmark_name: "${{ inputs.benchmark_name || 'channel-scaling-bursty-point-select' }}"
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  run-point-select-single-core:
    if: ${{ github.event_name == 'schedule' || inputs.action == 'all' || inputs.action == 'point-select-single-core' }}
    uses: ./.github/workflows/benchmark-template.yml
    with:
      clients: "${{ inputs.clients != '' && inputs.clients || '[\"node\", \"python\"]' }}"
      benchmark_types: '["point-select"]'
      duration: "${{ inputs.duration || '1h' }}"
      load_type: 'spiky'
      tps: "${{ inputs.tps != '' && inputs.tps || '600' }}"
      threads: '100'
      burst_factor: '3.0'
      burst_duration: '5.0'
      burst_fraction: '0.25'
      cpu: '4'
      memory: '4Gi'
      use_sidecar: 'true'
      workers: '1'
      client_branch: "${{ inputs.client_branch || 'main' }}"
      spanner_enable_channel_pool: "${{ inputs.spanner_enable_channel_pool || 'false' }}"
      benchmark_name: "${{ inputs.benchmark_name || 'channel-scaling-bursty-point-select' }}"
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  run-select-update-multi-core:
    if: ${{ github.event_name == 'schedule' || inputs.action == 'all' || inputs.action == 'select-update-multi-core' }}
    uses: ./.github/workflows/benchmark-template.yml
    with:
      clients: "${{ inputs.clients != '' && inputs.clients || '[\"java\", \"go\", \"rust\", \"node\"]' }}"
      benchmark_types: '["select-update"]'
      duration: "${{ inputs.duration || '1h' }}"
      load_type: 'spiky'
      tps: "${{ inputs.tps != '' && inputs.tps || '2000' }}"
      threads: '500'
      burst_factor: '3.8'
      burst_duration: '5.0'
      burst_fraction: '0.25'
      cpu: '4'
      memory: '4Gi'
      use_sidecar: 'true'
      spanner_num_channels: '16'
      client_branch: "${{ inputs.client_branch || 'main' }}"
      spanner_enable_channel_pool: "${{ inputs.spanner_enable_channel_pool || 'false' }}"
      benchmark_name: "${{ inputs.benchmark_name || 'channel-scaling-bursty-select-update' }}"
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  run-select-update-single-core:
    if: ${{ github.event_name == 'schedule' || inputs.action == 'all' || inputs.action == 'select-update-single-core' }}
    uses: ./.github/workflows/benchmark-template.yml
    with:
      clients: "${{ inputs.clients != '' && inputs.clients || '[\"node\", \"python\"]' }}"
      benchmark_types: '["select-update"]'
      duration: "${{ inputs.duration || '1h' }}"
      load_type: 'spiky'
      tps: "${{ inputs.tps != '' && inputs.tps || '100' }}"
      threads: '80'
      burst_factor: '3.0'
      burst_duration: '5.0'
      burst_fraction: '0.25'
      cpu: '4'
      memory: '4Gi'
      use_sidecar: 'true'
      workers: '1'
      client_branch: "${{ inputs.client_branch || 'main' }}"
      spanner_enable_channel_pool: "${{ inputs.spanner_enable_channel_pool || 'false' }}"
      benchmark_name: "${{ inputs.benchmark_name || 'channel-scaling-bursty-select-update' }}"
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
