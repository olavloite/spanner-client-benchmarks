name: Channel Scaling Bursty Benchmarks

on:
  schedule:
    # Run daily at 08:30 UTC
    - cron: '30 8 * * *'
  workflow_dispatch:
    inputs:
      for_alerting:
        description: 'Mark metrics for alerting'
        required: false
        type: boolean
        default: false

jobs:
  run-point-select-multi-core:
    uses: ./.github/workflows/benchmark-template.yml
    with:
      clients: '["java", "go", "rust"]'
      benchmark_types: '["point-select"]'
      duration: '1h'
      load_type: 'spiky'
      tps: '2000'
      threads: '500'
      burst_factor: '3.8'
      burst_duration: '5.0'
      burst_fraction: '0.25'
      cpu: '8'
      memory: '4Gi'
      benchmark_name: 'channel-scaling-bursty-point-select'
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  run-point-select-single-core:
    uses: ./.github/workflows/benchmark-template.yml
    with:
      clients: '["node", "python"]'
      benchmark_types: '["point-select"]'
      duration: '1h'
      load_type: 'spiky'
      tps: '1300'
      threads: '120'
      burst_factor: '3.0'
      burst_duration: '5.0'
      burst_fraction: '0.25'
      cpu: '2'
      memory: '1Gi'
      benchmark_name: 'channel-scaling-bursty-point-select'
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  run-select-update-multi-core:
    uses: ./.github/workflows/benchmark-template.yml
    with:
      clients: '["java", "go", "rust"]'
      benchmark_types: '["select-update"]'
      duration: '1h'
      load_type: 'spiky'
      tps: '2000'
      threads: '500'
      burst_factor: '3.8'
      burst_duration: '5.0'
      burst_fraction: '0.25'
      cpu: '8'
      memory: '4Gi'
      benchmark_name: 'channel-scaling-bursty-select-update'
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}

  run-select-update-single-core:
    uses: ./.github/workflows/benchmark-template.yml
    with:
      clients: '["node", "python"]'
      benchmark_types: '["select-update"]'
      duration: '1h'
      load_type: 'spiky'
      tps: '1300'
      threads: '120'
      burst_factor: '3.0'
      burst_duration: '5.0'
      burst_fraction: '0.25'
      cpu: '2'
      memory: '1Gi'
      benchmark_name: 'channel-scaling-bursty-select-update'
      for_alerting: "${{ github.event_name == 'schedule' || inputs.for_alerting == true || inputs.for_alerting == 'true' }}"
    secrets:
      GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
